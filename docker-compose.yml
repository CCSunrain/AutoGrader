services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autograder}
      POSTGRES_DB: autograder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograder -d autograder"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://autograder:${POSTGRES_PASSWORD:-autograder}@db:5432/autograder
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-do-not-use-in-production-0123456789abcdef}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.db.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://autograder:${POSTGRES_PASSWORD:-autograder}@db:5432/autograder
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-do-not-use-in-production-0123456789abcdef}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.worker.main

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
